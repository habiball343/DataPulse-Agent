[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "datapulse-agent"
version = "0.1.0"
description = "基于 MCP 协议的智能问数与报表分析助手：Text-to-SQL + SQL 安全沙箱 + 执行反馈自修复"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ding Bo" }]
keywords = ["mcp", "text-to-sql", "langgraph", "llm", "agent", "nl2sql"]
dependencies = [
    "mcp>=2.0,<3",
    "langgraph>=1.0",
    "openai>=1.40",
    "chromadb>=1.0",
    "sqlglot>=25",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "streamlit-echarts>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
datapulse = "datapulse.cli:main"
datapulse-mcp = "datapulse.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datapulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
